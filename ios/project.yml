# Gera o VozEmocao.xcodeproj com o XcodeGen (https://github.com/yonaskolb/XcodeGen)
#   brew install xcodegen && cd ios && xcodegen generate
name: VozEmocao
options:
  bundleIdPrefix: com.vozemocao
  deploymentTarget:
    iOS: "16.0"
targets:
  VozEmocao:
    type: application
    platform: iOS
    sources:
      - VozEmocao/Sources
    settings:
      base:
        INFOPLIST_FILE: VozEmocao/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.vozemocao.app
        # Assinatura fixada aqui para que `xcodegen generate` não apague o Team
        # a cada regeração. (Team ID pessoal do Helio — não é credencial: assinar
        # exige o certificado privado, que fica no Keychain do Mac dele.)
        DEVELOPMENT_TEAM: AT9X5B3TBB
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
