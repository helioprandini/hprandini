# Gera o VozEmocao.xcodeproj com o XcodeGen (https://github.com/yonaskolb/XcodeGen)
#   brew install xcodegen && cd ios && xcodegen generate
name: VozEmocao
options:
  bundleIdPrefix: com.vozemocao
  deploymentTarget:
    iOS: "16.0"
targets:
  VozEmocao:
    type: application
    platform: iOS
    sources:
      - VozEmocao/Sources
    settings:
      base:
        INFOPLIST_FILE: VozEmocao/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.vozemocao.app
        CODE_SIGN_STYLE: Automatic
        # NÃO fixar DEVELOPMENT_TEAM com um valor adivinhado: um ID errado faz o
        # build falhar com "No Account for Team". Para fixá-lo de vez, pegue o ID
        # real com `security find-identity -v -p codesigning` (aparece entre
        # parênteses) e acrescente aqui: DEVELOPMENT_TEAM: <ID>.
        # Enquanto não estiver fixado, escolha o Team no Xcode após cada
        # `xcodegen generate` (Target → Signing & Capabilities → Team).
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
